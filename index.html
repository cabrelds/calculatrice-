<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Calculatrice Scientifique</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- Rangée puissances et racines -->
        <div class="button-row row-powers">
          <button class="btn btn-func" data-action="square" data-shift="sqrt">
            <span class="primary">x²</span>
            <span class="shift-label">√</span>
          </button>
          <button class="btn btn-func" data-action="cube" data-shift="cbrt">
            <span class="primary">x³</span>
            <span class="shift-label">∛</span>
          </button>
          <button class="btn btn-func" data-action="pow" data-shift="nrt">
            <span class="primary">xʸ</span>
            <span class="shift-label">ʸ√x</span>
          </button>
          <button class="btn btn-func" data-action="pi" data-shift="e_const">
            <span class="primary">π</span>
            <span class="shift-label">e</span>
          </button>
          <button class="btn btn-func" data-action="factorial" data-shift="abs">
            <span class="primary">n!</span>
            <span class="shift-label">|x|</span>
          </button>
        </div>
  <script src="script.js"></script>
</body>
</html>
