<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Calculatrice Scientifique</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- Rangée trigonométrie -->
        <div class="button-row row-trig">
          <button class="btn btn-func" data-action="sin" data-shift="asin">
            <span class="primary">sin</span>
            <span class="shift-label">sin⁻¹</span>
          </button>
          <button class="btn btn-func" data-action="cos" data-shift="acos">
            <span class="primary">cos</span>
            <span class="shift-label">cos⁻¹</span>
          </button>
          <button class="btn btn-func" data-action="tan" data-shift="atan">
            <span class="primary">tan</span>
            <span class="shift-label">tan⁻¹</span>
          </button>
          <button class="btn btn-func" data-action="log" data-shift="pow10">
            <span class="primary">log</span>
            <span class="shift-label">10ˣ</span>
          </button>
          <button class="btn btn-func" data-action="ln" data-shift="exp_e">
            <span class="primary">ln</span>
            <span class="shift-label">eˣ</span>
          </button>
        </div>
<!-- Rangée hyperboliques -->
        <div class="button-row row-trig">
          <button class="btn btn-func" data-action="hyperbolic" data-shift="arc_hyp">
            <span class="primary">HYP</span>
            <span class="shift-label">ARC</span>
          </button>
          <button class="btn btn-func" data-action="sinh" data-shift="asinh">
            <span class="primary">sinh</span>
            <span class="shift-label">sinh⁻¹</span>
          </button>
          <button class="btn btn-func" data-action="cosh" data-shift="acosh">
            <span class="primary">cosh</span>
            <span class="shift-label">cosh⁻¹</span>
          </button>
          <button class="btn btn-func" data-action="tanh" data-shift="atanh">
            <span class="primary">tanh</span>
            <span class="shift-label">tanh⁻¹</span>
          </button>
          <button class="btn btn-func" data-action="floor" title="Partie entiere">⌊x⌋</button>
        </div>
  <script src="script.js"></script>
</body>
</html>
