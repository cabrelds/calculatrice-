<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Calculatrice Scientifique</title>
  <link rel="preconnect"href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
   <div class="calc-wrapper">
    <div class="calculator">

      <!-- En-tête marque -->
      <div class="calc-brand">
        <span class="brand-name">SCILAB</span>
        <span class="brand-model">fx-9860 PRO</span>
        <div class="brand-line"></div>
      </div>
<!-- Zone de boutons -->
      <div class="buttons-area">

        <!-- Rangée 7 8 9 ÷ -->
        <div class="button-row row-digits">
          <button class="btn btn-digit" data-action="digit" data-value="7">7</button>
          <button class="btn btn-digit" data-action="digit" data-value="8">8</button>
          <button class="btn btn-digit" data-action="digit" data-value="9">9</button>
          <button class="btn btn-op" data-action="op" data-value="÷">÷</button>
        </div>
<!-- Rangée chiffres 4 5 6 -->
        <div class="button-row row-digits">
          <button class="btn btn-digit" data-action="digit" data-value="4">4</button>
          <button class="btn btn-digit" data-action="digit" data-value="5">5</button>
          <button class="btn btn-digit" data-action="digit" data-value="6">6</button>
          <button class="btn btn-op" data-action="op" data-value="×">×</button>
        </div>

        <!-- Rangée chiffres 1 2 3 -->
        <div class="button-row row-digits">
          <button class="btn btn-digit" data-action="digit" data-value="1">1</button>
          <button class="btn btn-digit" data-action="digit" data-value="2">2</button>
          <button class="btn btn-digit" data-action="digit" data-value="3">3</button>
          <button class="btn btn-op" data-action="op" data-value="−">−</button>
        </div>

        <!-- Rangée 0 . ± + = -->
        <div class="button-row row-digits">
          <button class="btn btn-digit btn-zero" data-action="digit" data-value="0">0</button>
          <button class="btn btn-digit" data-action="dot">.</button>
          <button class="btn btn-op" data-action="negate">±</button>
          <button class="btn btn-op" data-action="op" data-value="+">+</button>
        </div>

      </div>


    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
