<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Calculatrice Scientifique</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- Rangée puissances et racines -->
        <div class="button-row row-powers">
          <button class="btn btn-func" data-action="square" data-shift="sqrt">
            <span class="primary">x²</span>
            <span class="shift-label">√</span>
          </button>
          <button class="btn btn-func" data-action="cube" data-shift="cbrt">
            <span class="primary">x³</span>
            <span class="shift-label">∛</span>
          </button>
          <button class="btn btn-func" data-action="pow" data-shift="nrt">
            <span class="primary">xʸ</span>
            <span class="shift-label">ʸ√x</span>
          </button>
          <button class="btn btn-func" data-action="pi" data-shift="e_const">
            <span class="primary">π</span>
            <span class="shift-label">e</span>
          </button>
          <button class="btn btn-func" data-action="factorial" data-shift="abs">
            <span class="primary">n!</span>
            <span class="shift-label">|x|</span>
          </button>
        </div>
<!-- Rangée logarithmes -->
        <div class="button-row row-paren">
          <button class="btn btn-func" data-action="log" data-shift="pow10">
            <span class="primary">log</span>
            <span class="shift-label">10ˣ</span>
          </button>
          <button class="btn btn-func" data-action="ln" data-shift="exp_e">
            <span class="primary">ln</span>
            <span class="shift-label">eˣ</span>
          </button>
          <button class="btn btn-func" data-action="log2" title="log base 2">log₂</button>
          <button class="btn btn-func" data-action="exp_notation" title="× 10ⁿ">EXP</button>
          <button class="btn btn-func" data-action="reciprocal" title="1/x">1/x</button>
        </div>
  <script src="script.js"></script>
</body>
</html>
