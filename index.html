<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Calculatrice Scientifique</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
        <div class="button-row row-mem">
          <button class="btn btn-mem" data-action="mc" title="Mémoire Clear">MC</button>
          <button class="btn btn-mem" data-action="mr" title="Mémoire Recall">MR</button>
          <button class="btn btn-mem" data-action="mplus" title="Mémoire +">M+</button>
          <button class="btn btn-mem" data-action="mminus" title="Mémoire -">M−</button>
          <button class="btn btn-func" data-action="mod" title="Modulo">
            <span class="primary">mod</span>
          </button>
        </div>

  <script src="script.js"></script>
</body>
</html>
